services:
  nginx:
    image: nginx:1.29-alpine
    develop:
      watch:
        - action: restart
          path: config/nginx/nginx.conf.template
    ports:
      - target: 8080
        published: "${NGINX_HOST_PORT:-8080}"
        protocol: tcp
    environment:
      # Rendered into the template by the image entrypoint (envsubst).
      NGINX_HOST_PORT: ${NGINX_HOST_PORT:-8080}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: "^NGINX_HOST_PORT$$"
    volumes:
      - source: config/nginx/nginx.conf.template
        target: /etc/nginx/templates/nginx.conf.template
        type: bind
      - source: wagtail-static
        target: /usr/share/nginx/html/static
        type: volume
      - source: frontend-dist
        target: /usr/share/nginx/html/frontend
        type: volume
        read_only: true
    depends_on:
      wagtail:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
      s3:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      start_interval: 2s
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 5

  # One-shot job: downloads the latest recipes-frontend release into the
  # frontend-dist volume (pin with FRONTEND_VERSION, e.g. v0.5.0).
  frontend:
    image: curlimages/curl:8.16.0
    user: root
    entrypoint: ["sh", "/install.sh"]
    environment:
      FRONTEND_VERSION:
      FRONTEND_FORCE:
    volumes:
      - source: config/frontend/install.sh
        target: /install.sh
        type: bind
        read_only: true
      - source: frontend-dist
        target: /dist
        type: volume
    restart: "no"

  wagtail:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DJANGO_SETTINGS_MODULE: "recipe_cms.settings.dev"
    develop:
      watch:
        - action: sync
          path: src
          target: /app
          initial_sync: true
    # Migrate and (re)create the local users from .env before serving.
    command:
      - sh
      - -c
      - >-
        uv run manage.py migrate --noinput &&
        uv run manage.py ensure_users &&
        uv run manage.py runserver 0.0.0.0:8000
    environment:
      AUTH_PROVIDERS:
      SOCIAL_AUTH_AUTH0_OPENIDCONNECT_DOMAIN:
      SOCIAL_AUTH_AUTH0_OPENIDCONNECT_KEY:
      SOCIAL_AUTH_AUTH0_OPENIDCONNECT_SECRET:
      AUTH0_ROLES_CLAIM:
      SOCIAL_AUTH_ZITADEL_DOMAIN:
      SOCIAL_AUTH_ZITADEL_KEY:
      SOCIAL_AUTH_ZITADEL_SECRET:
      ZITADEL_ROLE_ORG_ID:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
      POSTGRES_HOST:
      SECRET_KEY:
      BASE_PATH: /
      S3_BUCKET_NAME:
      S3_ACCESS_KEY:
      S3_SECRET_KEY:
      S3_ENDPOINT_URL: http://s3:3900
      # Derived from the nginx port; an explicit value in .env wins.
      S3_CUSTOM_DOMAIN: ${S3_CUSTOM_DOMAIN:-localhost:${NGINX_HOST_PORT:-8080}/media}
      WAGTAILADMIN_BASE_URL: ${WAGTAILADMIN_BASE_URL:-http://localhost:${NGINX_HOST_PORT:-8080}}
      S3_URL_PROTOCOL:
      SESSION_COOKIE_NAME:
      CSRF_COOKIE_NAME:
      DJANGO_ADMIN_USERNAME:
      DJANGO_ADMIN_PASSWORD:
      DJANGO_ADMIN_EMAIL:
      DJANGO_EDITOR_USERNAME:
      DJANGO_EDITOR_PASSWORD:
      DJANGO_EDITOR_EMAIL:
      DJANGO_MODERATOR_USERNAME:
      DJANGO_MODERATOR_PASSWORD:
      DJANGO_MODERATOR_EMAIL:
    volumes:
      - source: wagtail-static
        target: /app/static
        type: volume
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      start_interval: 2s
      start_period: 20s
      interval: 30s
      timeout: 10s
      retries: 5

  database:
    image: postgres:18
    ports:
      - target: 5432
        published: "${POSTGRES_HOST_PORT:-5432}"
        protocol: tcp
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
    volumes:
      - source: wagtail-db-data
        target: /var/lib/postgresql
        type: volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      start_interval: 5s
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 5

  s3:
    image: dxflrs/garage:v2.2.0
    volumes:
      - source: config/garage/garage.toml
        target: /etc/garage.toml
        type: bind
      - source: garage-meta
        target: /var/lib/garage/meta
        type: volume
      - source: garage-data
        target: /var/lib/garage/data
        type: volume
    environment:
      GARAGE_ADMIN_TOKEN:
      GARAGE_METRICS_TOKEN:
      GARAGE_RPC_SECRET:

volumes:
  frontend-dist:
  wagtail-db-data:
  wagtail-static:
  garage-meta:
  garage-data:
