name: Build and Push Container Image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  IMAGE: rg.nl-ams.scw.cloud/namespace-relaxed-faraday/recipes-cms

jobs:
  amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.nl-ams.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Registry cache: the GHA cache is scoped to the ref, and every tag is a new ref.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-amd64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-amd64,mode=max,image-manifest=true,oci-mediatypes=true

      # recipes-infrastructure's e2e runs pick the latest GitHub release, not the newest tag.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Trigger e2e tests in recipes-infrastructure
        env:
          GH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: >-
          gh api repos/globz-eu/recipes-infrastructure/dispatches
          -f event_type=component-released
          -f "client_payload[repo]=$REPO_NAME"
          -f "client_payload[version]=$GITHUB_REF_NAME"
