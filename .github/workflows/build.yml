name: Build and Push Container Image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  IMAGE: rg.fr-par.scw.cloud/recipes-images/recipes-cms

jobs:
  amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Registry cache: the GHA cache is scoped to the ref, and every tag is a new ref.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-amd64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-amd64,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      # recipes-infrastructure's e2e runs pick the latest GitHub release, not the newest tag.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Trigger e2e tests in recipes-infrastructure
        env:
          GH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: >-
          gh api repos/globz-eu/recipes-infrastructure/dispatches
          -f event_type=component-released
          -f "client_payload[repo]=$REPO_NAME"
          -f "client_payload[version]=$GITHUB_REF_NAME"

  # Pushed by digest only, so vX.Y.Z (and staging, e2e) never waits on this job.
  arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

  # Built from both jobs' digests, not the tag's current value, so re-runs are safe.
  multi-arch:
    needs: [amd64, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Tag the multi-arch index
        env:
          AMD64_DIGEST: ${{ needs.amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.arm64.outputs.digest }}
        run: >-
          docker buildx imagetools create
          -t "$IMAGE:$GITHUB_REF_NAME"
          "$IMAGE@$AMD64_DIGEST"
          "$IMAGE@$ARM64_DIGEST"

  # A failed arm64 or multi-arch job leaves vX.Y.Z amd64-only; say so on the run.
  amd64-only-warning:
    needs: [amd64, arm64, multi-arch]
    if: ${{ always() && needs.amd64.result == 'success' && needs.multi-arch.result != 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report the amd64-only tag
        run: >-
          echo "::error::$GITHUB_REF_NAME is amd64-only.
          Use \"Re-run failed jobs\" on this run to build arm64 and the multi-arch index."
