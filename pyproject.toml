[project]
name = "recipes-cms"
version = "0.16.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-storages[s3]>=1.14.6",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.13",
    "social-auth-app-django>=7.2,<8",
    "wagtail>=8.1",
    "wagtail-storages>=2.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "invoke>=3.0.3",
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]

[tool.ruff]
exclude = [".venv", ".git", ".vscode", "__pycache__"]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "I",
    "C4",
    "SIM",
    "UP",
    "RET",
    "PERF",
    "B",
    "PIE",
    "PTH",
    "FURB",
    "C901",
    "PLR0912",
    "PLR0913",
    "ANN",
]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
"**/migrations/**" = [
    "ANN",
    "C4",
    "SIM",
    "UP",
    "RET",
    "PERF",
    "B",
    "PIE",
    "PTH",
    "FURB",
    "C901",
    "PLR0912",
    "PLR0913",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "src"
files = ["src", "tasks.py"]
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["*.tests.*", "*.migrations.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "wagtail.*",
    "social_core.*",
    "social_django.*",
    "modelcluster.*",
    "storages.*",
    "wagtail_storages.*",
    "invoke.*",
    "boto3.*",
    "botocore.*",
    "treebeard.*",
    "modelsearch.*",
    "taggit.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "recipe_cms.settings.dev"
