[project]
name = "recipes-cms"
version = "0.2.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django-storages[s3]>=1.14",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.10",
    "social-auth-app-django>=5.4.3",
    "wagtail>=7.1.3",
    "wagtail-storages>=2.0",
]

[dependency-groups]
dev = [
    "invoke>=2.2.1",
    "ruff>=0.15.1",
]

[tool.ruff]
exclude = [".venv", ".git", ".vscode", "__pycache__"]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["I"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
